<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 816 1056" role="img" aria-labelledby="sheet-title sheet-desc">
  <title id="sheet-title">The honey-do list</title>
  <desc id="sheet-desc">A printable checklist on Zip, LLC letterhead: sixteen empty checkboxes with ruled writing lines, the first one already ticked and filled in with Ivan Pineda's phone number, 971-288-3488.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .brand { font-size: 40px; font-weight: 800; fill: #5a0000; letter-spacing: -1px; }
    .tagline { font-size: 14.5px; font-weight: 600; fill: #6b5f5c; letter-spacing: .6px; }
    .phone { font-size: 21px; font-weight: 700; fill: #5a0000; }
    .hours { font-size: 13px; fill: #6b5f5c; }
    .title { font-size: 35px; font-weight: 800; fill: #241a19; letter-spacing: -1.2px; }
    .lede { font-size: 17px; fill: #6b5f5c; }
    .done { font-size: 17px; font-weight: 600; fill: #5a0000; }
    .foot { font-size: 10.5px; fill: #6b5f5c; }
    .box { fill: none; stroke: #5a0000; stroke-width: 1.6; }
    .rule { stroke: #cfc5bf; stroke-width: 1; }
    .tick { fill: none; stroke: #5a0000; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    .divider { stroke: #cfc5bf; stroke-width: 1; }
  </style>
