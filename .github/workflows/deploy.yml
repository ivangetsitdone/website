# Build and test on a runner; only then ship main to the droplet.
#
# The droplet's checkout must be /srv/website, which is where scripts/bootstrap.sh and
# cloud-init.yaml put it.
#
# Setup is two repository secrets — DEPLOY_KEY (an SSH private key whose public half is in
# the droplet's authorized_keys) and DEPLOY_KNOWN_HOSTS (the droplet's SSH host key). The
# optional DEPLOY_USER and DEPLOY_HOST repository *variables* override the defaults below.
# See DEPLOY.md, "Automatic deploys".
name: Deploy

on:
  push:
    branches: [main]
  pull_request:

# One run per branch. A superseded pull-request run is cancelled; a superseded main run is
# not, because a half-applied deploy is worse than a queued one.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE: https://ivangetsitdone.com
  PREVIEW_ADDRESS: ${{ vars.PREVIEW_ADDRESS || ':8081' }}
  # The check job publishes here; the deploy job tells the droplet to run exactly this.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The gate. Stands the whole stack up on the runner and tests it there, so a change that
  # breaks the site is caught before anything reaches the droplet. Touches nothing live and
  # needs no secrets, so it runs on pull requests from anywhere.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only to publish the image this job tested. Pull requests skip that step, and a fork's
    # token is read-only regardless.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Needs no stack and no browsers, so it fails in seconds rather than after the
      # build. Guards the rule that the droplet's checkout is the pipeline's alone.
      - name: The bootstrap guard holds
        run: python3 tests/test_bootstrap_guard.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ../../recovery/browsers

      - name: Production runtime policy
        run: python3 tests/test_production_runtime.py

      - name: Base images are pinned by digest
        run: python3 tests/test_image_pinning.py

      - name: Build the images and start the stack
        run: |
          # Plain HTTP on the runner, and a port for the www redirect rather than its real
          # hostname: Caddy provisions a certificate for every named site it is given, and
          # this host can answer no challenge for either name.
          printf 'SITE_ADDRESS=:80\nWWW_ADDRESS=:8080\nPREVIEW_ADDRESS=:8081\nAPP_IMAGE=%s\n' \
            "$IMAGE:$GITHUB_SHA" > .env
          docker compose up -d --build
          for _ in $(seq 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/healthz) || true
            if [ "$code" = 200 ]; then break; fi
            sleep 2
          done
          [ "$code" = 200 ] || { docker compose ps; docker compose logs --tail 80; exit 1; }

      - name: Pages, headers, caching and the licensing guardrails
        run: python3 tests/smoke.py http://localhost
      - name: Catalogue, generated assets and source isolation
        run: python3 tests/portfolio_http.py http://localhost
      - name: Browser suite, desktop and mobile
        run: npm test
        working-directory: tests/browser
        env:
          BASE_URL: http://localhost

      # Only now, with every suite green against this exact image. The deploy job will
      # pull this tag rather than rebuilding from source on the droplet, so what ships is
      # the artefact that was tested rather than a rebuild that ought to match it.
      - name: Publish the tested image
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker logout ghcr.io
          echo "published $IMAGE:$GITHUB_SHA"

      - name: What the stack said, if any of that failed
        if: failure()
        run: docker compose logs --tail 120
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-trace
          path: recovery/browser-results
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorise the runner against the droplet
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_KEY and DEPLOY_KNOWN_HOSTS are not set. See DEPLOY.md."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy the tested image
        env:
          TARGET: ${{ vars.DEPLOY_USER || 'root' }}@${{ vars.DEPLOY_HOST || 'ivangetsitdone.com' }}
        run: |
          ssh -o BatchMode=yes "$TARGET" 'bash -s --' "$GITHUB_SHA" "$PREVIEW_ADDRESS" "$IMAGE:$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          sha=$1
          preview_address=$2
          image=$3
          case "$preview_address" in
            :8081|preview.ivangetsitdone.com) ;;
            *) echo "::error::invalid PREVIEW_ADDRESS: $preview_address"; exit 1 ;;
          esac
          # The host runs whatever this names, so it is checked rather than trusted.
          [[ "$image" =~ ^ghcr\.io/[a-z0-9._/-]+:[0-9a-f]{40}$ ]] || {
            echo "::error::refusing to deploy unrecognised image: $image"; exit 1; }
          repository=${image%:*}

          cd /srv/website
          previous=$(git rev-parse HEAD)
          echo "deploying $sha over $previous"
          echo "image $image"

          # Keep whatever is serving now under a tag of its own, so a rollback is a restart
          # rather than a rebuild. This also covers the first deploy after the switch, where
          # the running image was built on this host and has no registry tag.
          rollback_image=""
          current_container=$(docker compose ps -q app 2>/dev/null || true)
          if [ -n "$current_container" ]; then
            rollback_image="$repository:$previous"
            docker tag "$(docker inspect -f '{{.Image}}' "$current_container")" "$rollback_image"
            echo "rollback image $rollback_image"
          fi

          wait_healthy() {
            local state=starting
            for _ in $(seq 60); do
              state=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)" 2>/dev/null || echo starting)
              if [ "$state" = healthy ]; then return 0; fi
              sleep 3
            done
            echo "app is $state after three minutes" >&2
            return 1
          }

          # The repository is public, so the droplet needs no key of its own to fetch.
          url=https://github.com/ivangetsitdone/website.git
          git remote set-url origin "$url" 2>/dev/null || git remote add origin "$url"
          git fetch --prune origin main
          # A deploy target, not a workspace: anything edited on the droplet is discarded.
          # .env is untracked and survives, which is how SITE_ADDRESS stays pinned.
          git reset --hard "$sha"
          touch .env
          if grep -q '^PREVIEW_ADDRESS=' .env; then
            sed -i "s|^PREVIEW_ADDRESS=.*|PREVIEW_ADDRESS=$preview_address|" .env
          else
            printf 'PREVIEW_ADDRESS=%s\n' "$preview_address" >> .env
          fi

          # compose.yaml names its project `website-local`, so a clone of this repository
          # elsewhere on the host cannot act on the live containers. This checkout is the
          # one entitled to `website`, and it must keep that name: compose.preview.yaml
          # joins the external network `website_default`, which is Compose's default
          # network for a project of that name. Set before any compose command below runs.
          if grep -q '^COMPOSE_PROJECT_NAME=' .env; then
            sed -i "s|^COMPOSE_PROJECT_NAME=.*|COMPOSE_PROJECT_NAME=website|" .env
          else
            printf 'COMPOSE_PROJECT_NAME=%s\n' website >> .env
          fi

          set_app_image() {
            if grep -q '^APP_IMAGE=' .env; then
              sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$1|" .env
            else
              printf 'APP_IMAGE=%s\n' "$1" >> .env
            fi
          }
          set_app_image "$image"

          # Before anything is touched. A registry outage, a bad tag or a half-published
          # image fails here, with the site still serving the previous commit and nothing
          # to roll back. The checkout is already at $sha, which the rollback path resets.
          docker pull "$image" || {
            echo "::error::could not pull $image; the site is untouched on $previous"
            git reset --hard "$previous"
            set_app_image "${rollback_image:-$image}"
            exit 1
          }

          # Any failure rolls back the same way, because there is no reliable way to tell
          # from here whether the containers were replaced before it happened: caddy
          # depends_on app with condition: service_healthy, so `up` itself fails once the
          # new app container is in place and refusing to pass its healthcheck. Resetting
          # the checkout without restoring the image would leave the host claiming a commit
          # it is not serving.
          #
          # The rollback starts an image that was already running on this host minutes ago,
          # so it cannot fail the way a rebuild can: no npm ci, no Pillow pass, no registry.
          # That mattered — the previous version rebuilt here, on the box whose memory
          # pressure is the most likely reason the deploy failed in the first place.
          roll_back() {
            echo "::error::$1"
            git reset --hard "$previous"
            if [ -z "$rollback_image" ]; then
              echo "::error::nothing was running to roll back to - the site is down"
              exit 1
            fi
            echo "rolling back to $previous on $rollback_image"
            set_app_image "$rollback_image"
            if docker compose up -d --no-build && wait_healthy; then
              echo "rolled back; the site is serving $previous"
            else
              echo "::error::the rollback is unhealthy too - the site is down"
            fi
            exit 1
          }

          docker compose up -d --no-build || roll_back "compose up failed for $sha"
          wait_healthy || { docker compose logs --tail 80 app; roll_back "$sha never became healthy"; }

          # The Caddyfile is bind-mounted, so Compose does not recreate the proxy when it
          # changes and an edit would otherwise never reach the running config. Reloading
          # is graceful: measured at 482 requests straight through a reload, zero errors.
          # `docker compose exec` otherwise inherits the SSH here-document on stdin and can
          # consume every deployment command that follows this reload.
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile </dev/null

          # Prove the host is on the commit this run deployed, rather than assuming it.
          head=$(git rev-parse HEAD)
          [ "$head" = "$sha" ] || { echo "::error::HEAD is $head, expected $sha"; exit 1; }

          # And that it is serving the image the gate tested, not one left over from an
          # earlier run. The checkout and the running container have to agree; before, the
          # host rebuilt and the two could only be assumed to match.
          running=$(docker inspect -f '{{.Config.Image}}' "$(docker compose ps -q app)")
          [ "$running" = "$image" ] || {
            echo "::error::serving $running, expected $image"; exit 1; }

          # Publish preview policy only after this production commit is healthy and active.
          # The helper is root-owned, but the preview key belongs to a dedicated system user.
          install -o root -g root -m 0755 scripts/deploy_preview.sh \
            /usr/local/sbin/website-preview-deploy

          # Remove the short-lived preview key that was mistakenly added to root.
          if [ -f /root/.ssh/authorized_keys ]; then
            sed -i '/github-preview@ivangetsitdone$/d' /root/.ssh/authorized_keys
          fi

          id preview-deploy >/dev/null 2>&1 || useradd -m -s /bin/bash preview-deploy
          # Keep password authentication unusable in practice while avoiding an account-lock
          # state that makes sshd reject the user before public-key authentication.
          preview_password=$(openssl rand -base64 32)
          printf 'preview-deploy:%s\n' "$preview_password" | chpasswd
          usermod -aG docker preview-deploy
          preview_home=$(getent passwd preview-deploy | cut -d: -f6)
          preview_uid=$(id -u preview-deploy)
          preview_public_key=$(cat deploy/preview_deploy.pub)
          preview_key_options='no-port-forwarding,no-agent-forwarding,no-X11-forwarding,no-pty,command="/usr/local/sbin/website-preview-deploy"'
          authorized_key_files=$(/usr/sbin/sshd -T -C user=preview-deploy,host=ivangetsitdone.com,addr=127.0.0.1 | \
            awk '$1 == "authorizedkeysfile" { for (i = 2; i <= NF; i++) print $i }')
          [ -n "$authorized_key_files" ] || { echo "::error::sshd reports no AuthorizedKeysFile"; exit 1; }
          while read -r template; do
            key_file=${template//%h/$preview_home}
            key_file=${key_file//%u/preview-deploy}
            key_file=${key_file//%U/$preview_uid}
            case "$key_file" in
              /*) ;;
              *) key_file="$preview_home/$key_file" ;;
            esac
            install -d -m 0700 -o preview-deploy -g preview-deploy "$(dirname "$key_file")"
            touch "$key_file"
            sed -i '/github-preview@ivangetsitdone$/d' "$key_file"
            printf '%s %s\n' "$preview_key_options" "$preview_public_key" >> "$key_file"
            chown preview-deploy:preview-deploy "$key_file"
            chmod 0600 "$key_file"
            echo "installed restricted preview key in $key_file"
          done <<< "$authorized_key_files"
          install -d -m 0755 -o preview-deploy -g preview-deploy /srv/website-preview
          /usr/sbin/sshd -t
          /usr/sbin/sshd -T -C user=preview-deploy,host=ivangetsitdone.com,addr=127.0.0.1 | \
            awk '$1 ~ /^(allowusers|denyusers|authorizedkeysfile|pubkeyauthentication)$/ { print }'

          # Deployed images accumulate one tag per commit. Keep the one serving and the one
          # a rollback would need; discard the rest. The build cache is pruned too: nothing
          # builds here any more, but a hand-run `compose up --build` would still fill it.
          docker image ls "$repository" --format '{{.Repository}}:{{.Tag}}' |
            while read -r tag; do
              case "$tag" in
                "$image"|"$rollback_image") ;;
                *) docker image rm "$tag" >/dev/null 2>&1 || true ;;
              esac
            done
          docker image prune -f >/dev/null
          docker builder prune -f --filter until=168h >/dev/null
          df -h / | tail -1
          docker compose ps
          REMOTE

      - name: The site answers over HTTPS
        run: |
          for _ in $(seq 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/") && [ "$code" = 200 ] && break
            sleep 3
          done
          echo "$SITE -> $code"
          [ "$code" = 200 ]

  # Post-deploy, against production. The application was already tested on the runner, so
  # what is left to prove is that this host, this Caddy and this certificate are serving it.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Pages, headers, caching and the licensing guardrails
        run: python3 tests/smoke.py "$SITE"
      - name: Catalogue, generated assets and source isolation
        run: python3 tests/portfolio_http.py "$SITE"
