# Build and test on a runner; only then ship main to the droplet.
#
# The droplet's checkout must be /srv/website, which is where scripts/bootstrap.sh and
# cloud-init.yaml put it.
#
# Setup is two repository secrets — DEPLOY_KEY (an SSH private key whose public half is in
# the droplet's authorized_keys) and DEPLOY_KNOWN_HOSTS (the droplet's SSH host key). The
# optional DEPLOY_USER and DEPLOY_HOST repository *variables* override the defaults below.
# See DEPLOY.md, "Automatic deploys".
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch. A superseded pull-request run is cancelled; a superseded main run is
# not, because a half-applied deploy is worse than a queued one.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE: https://ivangetsitdone.com

jobs:
  # The gate. Stands the whole stack up on the runner and tests it there, so a change that
  # breaks the site is caught before anything reaches the droplet. Touches nothing live and
  # needs no secrets, so it runs on pull requests from anywhere.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ../../recovery/browsers

      - name: Build the images and start the stack
        run: |
          # Plain HTTP on the runner, and a port for the www redirect rather than its real
          # hostname: Caddy provisions a certificate for every named site it is given, and
          # this host can answer no challenge for either name.
          printf 'SITE_ADDRESS=:80\nWWW_ADDRESS=:8080\n' > .env
          docker compose up -d --build
          for _ in $(seq 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/healthz) || true
            if [ "$code" = 200 ]; then break; fi
            sleep 2
          done
          [ "$code" = 200 ] || { docker compose ps; docker compose logs --tail 80; exit 1; }

      - name: Pages, headers, caching and the licensing guardrails
        run: python3 tests/smoke.py http://localhost
      - name: Catalogue, generated assets and source isolation
        run: python3 tests/portfolio_http.py http://localhost
      - name: Browser suite, desktop and mobile
        run: npm test
        working-directory: tests/browser
        env:
          BASE_URL: http://localhost

      - name: What the stack said, if any of that failed
        if: failure()
        run: docker compose logs --tail 120
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: recovery/browser-results
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authorise the runner against the droplet
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_KEY and DEPLOY_KNOWN_HOSTS are not set. See DEPLOY.md."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull, rebuild and restart
        env:
          TARGET: ${{ vars.DEPLOY_USER || 'root' }}@${{ vars.DEPLOY_HOST || 'ivangetsitdone.com' }}
        run: |
          ssh -o BatchMode=yes "$TARGET" 'bash -s --' "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          sha=$1

          cd /srv/website
          previous=$(git rev-parse HEAD)
          echo "deploying $sha over $previous"

          wait_healthy() {
            local state=starting
            for _ in $(seq 60); do
              state=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)" 2>/dev/null || echo starting)
              if [ "$state" = healthy ]; then return 0; fi
              sleep 3
            done
            echo "app is $state after three minutes" >&2
            return 1
          }

          # The repository is public, so the droplet needs no key of its own to fetch.
          url=https://github.com/ivangetsitdone/website.git
          git remote set-url origin "$url" 2>/dev/null || git remote add origin "$url"
          git fetch --prune origin main
          # A deploy target, not a workspace: anything edited on the droplet is discarded.
          # .env is untracked and survives, which is how SITE_ADDRESS stays pinned.
          git reset --hard "$sha"

          # Any failure rolls back the same way, because there is no reliable way to tell
          # from here whether the containers were replaced before it happened: caddy
          # depends_on app with condition: service_healthy, so `up` itself fails once the
          # new app container is in place and refusing to pass its healthcheck. Resetting
          # the checkout without rebuilding would leave the host claiming a commit it is
          # not serving. Rebuilding the previous commit is cheap — its layers are still in
          # the build cache — and is a no-op when the containers really were untouched.
          roll_back() {
            echo "::error::$1"
            echo "rolling back to $previous"
            git reset --hard "$previous"
            if docker compose up -d --build && wait_healthy; then
              echo "rolled back; the site is serving $previous"
            else
              echo "::error::the rollback is unhealthy too - the site is down"
            fi
            exit 1
          }

          docker compose up -d --build || roll_back "compose up failed for $sha"
          wait_healthy || { docker compose logs --tail 80 app; roll_back "$sha never became healthy"; }

          # The Caddyfile is bind-mounted, so Compose does not recreate the proxy when it
          # changes and an edit would otherwise never reach the running config. Reloading
          # is graceful: measured at 482 requests straight through a reload, zero errors.
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile

          # Prove the host is on the commit this run deployed, rather than assuming it.
          head=$(git rev-parse HEAD)
          [ "$head" = "$sha" ] || { echo "::error::HEAD is $head, expected $sha"; exit 1; }

          # The image the last deploy built is now untagged, and the build cache grows
          # without bound. Both matter on a 2 GB droplet with a small disk.
          docker image prune -f >/dev/null
          docker builder prune -f --filter until=168h >/dev/null
          df -h / | tail -1
          docker compose ps
          REMOTE

      - name: The site answers over HTTPS
        run: |
          for _ in $(seq 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/") && [ "$code" = 200 ] && break
            sleep 3
          done
          echo "$SITE -> $code"
          [ "$code" = 200 ]

  # Post-deploy, against production. The application was already tested on the runner, so
  # what is left to prove is that this host, this Caddy and this certificate are serving it.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pages, headers, caching and the licensing guardrails
        run: python3 tests/smoke.py "$SITE"
      - name: Catalogue, generated assets and source isolation
        run: python3 tests/portfolio_http.py "$SITE"
