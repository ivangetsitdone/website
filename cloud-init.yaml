#cloud-config
# Paste this whole file into the "User data" field when creating the droplet.
# At first boot it fetches scripts/bootstrap.sh from this repository and runs it:
# Docker is installed if the image lacks it, the repository is cloned to
# /srv/website, and the site starts. Nothing is typed on the host.
#
# The site comes up on plain HTTP, so a DNS record that has not moved yet cannot
# wedge the first boot on a failing certificate request. Once the A record points
# here: `cd /srv/website && rm .env && docker compose up -d` — ivangetsitdone.com
# is the built-in default.
#
# Progress: tail -f /var/log/site-bootstrap.log
# Claude Code is not installed; running the site does not need it. To have it,
# change INSTALL_CLAUDE=no to yes below.

package_update: true
packages:
  - ca-certificates
  - curl
  - git

runcmd:
  - [ bash, -lc, "curl -fsSL https://raw.githubusercontent.com/ivangetsitdone/website/main/scripts/bootstrap.sh | SITE_ADDRESS=:80 INSTALL_CLAUDE=no bash >>/var/log/site-bootstrap.log 2>&1" ]
