#cloud-config
# Paste this whole file into the "User data" field when creating the droplet.
# It installs Docker if the image lacks it, clones this repository, and starts the
# site. Nothing else has to be typed on the host.
#
# By default the site comes up on plain HTTP so it works before DNS moves. Once the
# A record points here, edit /srv/website/.env to the real hostname and run
# `docker compose up -d` in /srv/website to get the certificate.

package_update: true
packages:
  - ca-certificates
  - curl
  - git

write_files:
  - path: /usr/local/bin/site-bootstrap
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # First-boot bootstrap. Safe to re-run: every step checks before acting.
      set -euo pipefail

      REPO=https://github.com/ivangetsitdone/website.git
      DIR=/srv/website
      # ":80" serves plain HTTP on the droplet's IP, which works before DNS moves.
      # Replace with the hostname (e.g. ivangetsitdone.com) once the A record
      # points at this droplet, then run `docker compose up -d` in $DIR.
      SITE=:80
      # Claude Code on the box, for working on it directly. "no" to skip.
      INSTALL_CLAUDE=yes

      if ! command -v docker >/dev/null; then
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
        . /etc/os-release
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" \
          > /etc/apt/sources.list.d/docker.list
        apt-get update
        apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      fi

      # Some images ship Docker without Compose v2, which compose.yaml requires.
      docker compose version >/dev/null 2>&1 || apt-get install -y docker-compose-plugin

      mkdir -p /srv
      if [ -d "$DIR/.git" ]; then
        git -C "$DIR" pull --ff-only
      else
        git clone "$REPO" "$DIR"
      fi

      # compose.yaml reads SITE_ADDRESS; .env keeps it across restarts and reboots.
      grep -q '^SITE_ADDRESS=' "$DIR/.env" 2>/dev/null || echo "SITE_ADDRESS=$SITE" > "$DIR/.env"

      cd "$DIR"
      docker compose up -d --build

      # Claude Code needs Node 18+. NodeSource rather than the distro package, whose
      # version depends on the Ubuntu release. The native installer script
      # (claude.ai/install.sh) has failed on a bare droplet here, so this is the
      # path that is known to work: Node 22 plus the npm package.
      if [ "$INSTALL_CLAUDE" = yes ] && ! command -v claude >/dev/null; then
        curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
        apt-get install -y nodejs
        npm install -g @anthropic-ai/claude-code
      fi

      # Containers carry `restart: unless-stopped`, so a reboot brings them back
      # without this script running again.
      echo "site-bootstrap finished at $(date -Is)"

runcmd:
  - [ bash, -lc, "/usr/local/bin/site-bootstrap >>/var/log/site-bootstrap.log 2>&1" ]
