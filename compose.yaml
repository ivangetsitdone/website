# A clone of this repository gets its own Compose project, so `docker compose` in a
# development checkout can never reach the live containers. Production opts back in to the
# name `website` through COMPOSE_PROJECT_NAME in its untracked .env — written by
# scripts/bootstrap.sh on a fresh host and ensured by deploy.yml on every deploy. That name
# is load-bearing beyond this file: compose.preview.yaml joins `website_default`, which is
# Compose's default network for the project called `website`.
name: website-local

services:
  app:
    build: .
    # `build` and `image` together: a local `docker compose up --build` builds and tags
    # website-app:local, while production sets APP_IMAGE to the registry tag of the image
    # the check job already built and tested, and runs --no-build. The default is
    # deliberately a local tag, so a checkout without APP_IMAGE never pulls a deploy image.
    image: ${APP_IMAGE:-website-app:local}
    restart: unless-stopped
    read_only: true
    # Measured on the live host: 39 MiB resident, 2 processes. The ceiling is not sized to
    # the app but to what else shares this 2 GB box — an image build during a deploy, and
    # whatever else is running. Unbounded, a runaway here lets the kernel choose the victim,
    # and it may well choose dockerd or caddy; bounded, the app alone dies and `restart:
    # unless-stopped` plus the healthcheck bring it back.
    mem_limit: 512m
    pids_limit: 128
    # No cpus cap, deliberately: this is the service that should win the single vCPU.
    # compose.preview.yaml caps preview at 0.75 so a candidate cannot starve production.
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      # Tuned to a container that now starts in about three seconds. These numbers set
      # how long a deploy waits to call itself good (start_period + one interval) and how
      # long a bad one takes to be rolled back (start_period + retries x interval): about
      # 10s and 20s, against 25s and 55s before.
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
  caddy:
    # Digest-pinned like the Dockerfile's bases, but Dependabot does not see it: its
    # docker ecosystem reads Dockerfiles and Kubernetes manifests, not Compose files.
    # The images job in .github/workflows/audit.yml watches this one instead.
    image: caddy:2-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    restart: unless-stopped
    # 15 MiB resident, 6 processes. Generous headroom, but a ceiling: losing the proxy
    # takes the whole site off the internet, so it must not be the process the kernel
    # reaches for when something else on the host misbehaves.
    mem_limit: 128m
    pids_limit: 64
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-ivangetsitdone.com}
      # Caddy provisions a certificate for every named site, so a preview host that
      # cannot answer a challenge for www must be given an address, not the name.
      WWW_ADDRESS: ${WWW_ADDRESS:-www.ivangetsitdone.com}
      # Preview stays on an unpublished internal address until DNS exists and the
      # PREVIEW_ADDRESS repository variable is set to preview.ivangetsitdone.com.
      PREVIEW_ADDRESS: ${PREVIEW_ADDRESS:-:8081}
      # Same idea for the development site, whose DNS does exist: production's .env names
      # the hostname, and anything else — a clone, a runner — gets an unpublished port.
      DEV_ADDRESS: ${DEV_ADDRESS:-:8083}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
